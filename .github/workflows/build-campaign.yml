name: build-f4utils-campaign
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - uses: NuGet/setup-nuget@v2

      - name: Restore packages (solution-level, packages.config)
        run: nuget restore src/F4Utils/F4Utils.sln

      - name: Build F4Utils.Campaign (plus its dependencies only)
        run: msbuild src/F4Utils/Campaign/F4Utils.Campaign.csproj /p:Configuration=Release /p:Platform=x86 /p:SolutionDir=$env:GITHUB_WORKSPACE\src\F4Utils\

      - name: List output
        run: Get-ChildItem src/F4Utils/Campaign/bin -Recurse -Include *.dll | Select-Object FullName

      - uses: actions/upload-artifact@v4
        with:
          name: f4utils-campaign
          path: src/F4Utils/Campaign/bin/**/Release/
